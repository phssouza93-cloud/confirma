name: Build, Push and Deploy Docker Image

on:
  push:
    branches: ["master"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Rodar lint
        run: npm run lint

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        run: |
          IMAGE_LATEST=ghcr.io/phssouza93-cloud/confirma:latest
          IMAGE_SHA=ghcr.io/phssouza93-cloud/confirma:${{ github.sha }}

          docker build --pull \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -t $IMAGE_LATEST -t $IMAGE_SHA .

          docker push $IMAGE_LATEST
          docker push $IMAGE_SHA

      - name: Deploy no servidor via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker service update \
              --image ghcr.io/phssouza93-cloud/confirma:latest \
              --force negociacm_negociacm || echo "Service ainda não existe — crie a stack 'negociacm' no Portainer antes do próximo push."
